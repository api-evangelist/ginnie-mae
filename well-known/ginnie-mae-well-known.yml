false_positive_warning: Four of the five hosts answer HTTP 200 to EVERY /.well-known path because www.ginniemae.gov,
  ginniemae.gov, bulk.ginniemae.gov and my.ginniemae.gov serve single-page applications with a catch-all
  route. A status-code-only probe of this provider would record nine served documents on each of four
  hosts — thirty-six documents that do not exist. Every 200 here was opened and found to be the same Angular
  index page. access.ginniemae.gov, which is an Oracle Access Manager login rather than an SPA, returns
  an honest 404 on all nine.
recommendation: 'A security.txt is the cheapest win available: Ginnie Mae already publishes a CISA BOD
  20-01 vulnerability disclosure policy with a contact address (ginniemaevdp@hud.gov), a scope and a three-business-day
  acknowledgement commitment at https://www.ginniemae.gov/site-policies/ginnie-mae-vulnerability-disclosure-policy.
  Serving those same facts as an RFC 9116 file at /.well-known/security.txt would make the policy discoverable
  by the scanners and researchers that look there first.'
