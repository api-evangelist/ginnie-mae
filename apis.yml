  name: Ginnie Mae Disclosure Data
  tags:
  - Federal-Government
  - Housing
  - Mortgage-Backed Securities
  tags_raw:
  - Federal Government
  - Housing
  - Mortgage-Backed Securities
  humanURL: https://www.ginniemae.gov/disclosure/disclosure-data/disclosure-data-download-files
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ginnie-mae.png
  baseURL: https://www.ginniemae.gov/disclosure-api/api
  properties:
  - url: https://www.ginniemae.gov/disclosure/disclosure-data/disclosure-data-download-files
    type: Documentation
  - url: https://bulk.ginniemae.gov/
    type: Portal
  description: >-
    Ginnie Mae's security- and loan-level disclosure for its mortgage-backed securities — daily, weekly,
    monthly and factor files covering single-family MBS, HMBS, Multifamily, REMIC and Platinum, plus the
    published file layouts. It is distributed as bulk downloadable files through the Disclosure Data Download
    application at bulk.ginniemae.gov, not as a callable API: the application is an Angular client over
    a file-download service, and file retrieval requires a free registered account, so no anonymous base
    URL exists. The baseURL recorded here is the download service the application's own production configuration
    names — read verbatim from https://bulk.ginniemae.gov/assets/config/config.prod.json (HTTP 200, "disclosureWcfUrl":
    "https://www.ginniemae.gov/disclosure-api/api") — NOT guessed from the domain. It is account-gated:
    probed 2026-09-12, https://bulk.ginniemae.gov/ returns HTTP 200 and https://www.ginniemae.gov/disclosure-api/api/download
    answers the single-page application shell to an anonymous GET rather than data.
