apis:
  - aid: ginnie-mae:ginnie-mae
    name: Ginnie Mae Disclosure Data
    tags:
      - Federal-Government
      - Housing
      - Mortgage-Backed-Securities
    tags_raw:
      - Federal Government
      - Housing
      - Mortgage-Backed Securities
    humanURL: https://www.ginniemae.gov/disclosure/disclosure-data/disclosure-data-download-files
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ginnie-mae.png
    baseURL: https://www.ginniemae.gov/disclosure-api/api
    properties:
      - url: https://www.ginniemae.gov/disclosure/disclosure-data/disclosure-data-download-files
        type: Documentation
      - url: https://bulk.ginniemae.gov/
        type: Portal
    description: >-
      Ginnie Mae's security- and loan-level disclosure for its mortgage-backed
      securities — daily, weekly, monthly and factor files covering single-family
      MBS, HMBS, Multifamily, REMIC and Platinum, plus the published file layouts.
      It is distributed as bulk downloadable files through the Disclosure Data
      Download application at bulk.ginniemae.gov, not as a callable API: the
      application is an Angular client over a file-download service, and file
      retrieval requires a free registered account, so no anonymous base URL
      exists. The baseURL recorded here is the download service the application's own
      production configuration names — read verbatim from
      https://bulk.ginniemae.gov/assets/config/config.prod.json (HTTP 200,
      "disclosureWcfUrl": "https://www.ginniemae.gov/disclosure-api/api") — NOT
      guessed from the domain. It is account-gated: probed 2026-09-12,
      https://bulk.ginniemae.gov/ returns HTTP 200 and
      https://www.ginniemae.gov/disclosure-api/api/download answers the single-page
      application shell to an anonymous GET rather than data.
  - aid: ginnie-mae:ginnie-mae-content-api
    name: Ginnie Mae Content API
    tags:
      - Federal-Government
      - Content
      - JSON-API
      - Open-Data
    tags_raw:
      - Federal Government
      - Content
      - JSON API
      - Open Data
    humanURL: https://www.ginniemae.gov/
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ginnie-mae.png
    baseURL: https://www.ginniemae.gov/api/v1
    description: >-
      The public, unauthenticated JSON:API 1.0 surface that ginniemae.gov's
      Angular single-page application is built on. A Drupal 10 back end exposes
      120 resource types at https://www.ginniemae.gov/api/v1/ — every one of them
      anonymously readable — alongside nine Views REST exports (site search, FAQ,
      press releases, glossary, mission areas, video categories, disclosure
      notifications) that declare their own exposed filters in each response, and
      RFC 9264 linkset documents for the site menus. Ginnie Mae publishes no
      OpenAPI, no developer portal and no documentation for it; the base URL was
      read from the application's own runtime configuration at
      /assets/config/config.prod.json and every described path was fetched
      anonymously and returned HTTP 200 on 2026-09-12. Note that robots.txt
      carries "Disallow: /api/" for crawlers.
    properties:
