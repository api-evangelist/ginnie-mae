notable_edges:
- edge: node--data_file_types -> media--disclosure_data_file (field_file_layout)
  why: 'This is the bridge between the website content estate and the MBS disclosure product: each disclosure
    data file type points at the published file-layout document that describes its fixed-width record
    structure. It is the closest thing Ginnie Mae publishes to a machine-navigable schema catalogue for
    its bulk disclosure files.'
- edge: node--memorandum -> media--document_file (field_featured_media)
  why: All Participant Memoranda, MBS Program Memoranda and bulletins carry their PDF attachment as a
    media reference, so the full APM corpus and its documents are traversable in two hops from the collection
    endpoint.
- edge: node--haps -> node--haps (field_related_articles) and -> node--haps_contributor (field_contributors)
  why: The research blog is a self-referential graph with a separate contributor entity — a real authorship
    model, not free text.
- edge: media--* -> file--file (field_media_file / field_media_image / thumbnail)
  why: Every document and image resolves to a file entity carrying the download URI, which is how an agent
    gets from a memorandum to the actual PDF.
omitted:
  types:
  - administrative and configuration entity types (view--view, field_config--field_config, entity_form_display--*,
    and similar)
  - identity and OAuth entity types (user--user, consumer--consumer, oauth2_token--*)
  reason: Drupal implementation surface rather than published data. user--user is additionally excluded
    because the collection returns CMS account display names to anonymous callers; it is recorded here
    as an observation about the surface, and no personal data from it is stored in this repository.
