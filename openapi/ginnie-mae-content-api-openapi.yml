openapi: 3.1.0
info:
  title: Ginnie Mae Content API
  version: 1.0.0
  summary: The public, unauthenticated JSON:API 1.0 content surface behind ginniemae.gov.
  description: |-
    Ginnie Mae serves its public website (www.ginniemae.gov) as an Angular single-page application against a Drupal 10 back end, and that back end exposes a **public, unauthenticated JSON:API 1.0 surface at `https://www.ginniemae.gov/api/v1/`** plus a set of Views REST exports and RFC 9264 linkset documents. Ginnie Mae publishes no OpenAPI, no developer portal and no documentation for this surface; the endpoints below were discovered from the application's own runtime configuration (`/assets/config/config.prod.json`) and its JSON:API entrypoint document, and **every path in this document was individually fetched anonymously and returned HTTP 200 on 2026-09-12**.

    **This is a content API, not a mortgage-data API.** It serves the website estate — FAQs, the glossary, press releases, All Participant Memoranda (APMs), bulletins, speeches, executive leadership, training announcements, media/document files and the page-building paragraphs. Ginnie Mae MBS disclosure data (pool/loan-level files, REMIC, HMBS, Platinum) is distributed as bulk files through the Disclosure Data Download application at `https://bulk.ginniemae.gov/`, which sits behind an account login and is not described here. Issuer systems reached through MyGinnieMae (`my.ginniemae.gov`) are behind SSO at `access.ginniemae.gov` and are likewise out of scope.

    **Scope of this description.** Only public *content* entity types are described. The entrypoint also exposes administrative and configuration entity types (`view--view`, `field_config--field_config`, `user--user`, `consumer--consumer`, `oauth2_token--*`, and others) which are deliberately omitted here: they are Drupal implementation surface rather than published data, and `user--user` returns CMS account display names. Reads only — no write operation was attempted against a live government system, so none is described. JSON:API itself defines POST/PATCH/DELETE on these URLs; whether Ginnie Mae permits them to an authenticated client is unverified.

    **Provenance.** GENERATED by API Evangelist from the provider's own machine-readable discovery document and live anonymous probes. It is NOT published by Ginnie Mae and does not claim to be. See `x-generated-from`.
