components:
  schemas:
    JsonApiVersion:
      type: object
      properties:
        version:
          type: string
          examples:
          - '1.0'
        meta:
          type: object
          additionalProperties: true
    JsonApiEntrypoint:
      type: object
      description: JSON:API 1.0 entrypoint document.
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          type: array
          items:
            type: object
        links:
          type: object
          description: One member per exposed resource type, keyed "<entity_type>--<bundle>".
          additionalProperties:
            type: object
            properties:
              href:
                type: string
                format: uri
    ResourceObject:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          examples:
          - node--press_releases
        id:
          type: string
          format: uuid
        links:
          type: object
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true
        attributes:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: This site runs JSON:API Extras with field enhancement, so resource attributes are flattened onto
        the resource object rather than nested under an "attributes" member. Both shapes are permitted here because
        the flattened shape is what the live surface returns.
    JsonApiCollectionDocument:
      type: object
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    JsonApiItemDocument:
      type: object
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          $ref: '#/components/schemas/ResourceObject'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        links:
          type: object
          additionalProperties: true
    JsonApiErrorDocument:
      type: object
      required:
      - errors
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiError'
    JsonApiError:
      type: object
      properties:
        title:
          type: string
          examples:
          - Bad Request
        status:
          type: string
          examples:
          - '400'
        detail:
          type: string
          examples:
          - Invalid nested filtering. The field `nope`, given in the path `nope`, does not exist.
        links:
          type: object
          properties:
            via:
              type: object
              properties:
                href:
                  type: string
                  format: uri
            info:
              type: object
              properties:
                href:
                  type: string
                  format: uri
    Pager:
      type: object
      properties:
        current_page:
          type: integer
        items_per_page:
          type: integer
        total_pages:
          type: integer
        total_results:
          type: integer
    PagedResults:
      type: object
      properties:
        filters:
          type: array
          items:
            type: string
          description: The exposed filter names this endpoint accepts — the surface self-documents its own query
            parameters here.
        pager:
          $ref: '#/components/schemas/Pager'
        results:
          type: array
          items:
            type: object
            additionalProperties: true
    Linkset:
      type: object
      description: RFC 9264 linkset document.
      properties:
        linkset:
          type: array
          items:
            type: object
            properties:
              anchor:
                type: string
              item:
                type: array
                items:
                  type: object
                  properties:
                    href:
                      type: string
                    title:
                      type: string
                    hierarchy:
                      type: array
                      items:
                        type: string
                    machine-name:
                      type: array
                      items:
                        type: string
                    is-hidden:
                      type: array
                      items:
                        type: string
                    isProtected:
                      type: boolean
  responses:
    BadRequest:
      description: Malformed query — for example an unknown filter field. Returned as a JSON:API error document.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiErrorDocument'
    Forbidden:
      description: The requester may not read this resource. Returned as a JSON:API error document.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiErrorDocument'
    NotFound:
      description: 'No such resource. NOTE: an unknown resource TYPE under /api/v1 is answered by Drupal with an
        HTML 404 page rather than a JSON:API error document (observed 2026-09-12).'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiErrorDocument'
        text/html:
          schema:
            type: string
