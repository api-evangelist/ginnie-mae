provider: Ginnie Mae
providerId: ginnie-mae
generated: '2026-09-12'
method: searched
source: >-
  Search of ginniemae.gov (sitemap.xml, 1,786 URLs; footer and main linksets; site
  search at /api/v1/search/results) for any pricing, plan, tier, quota or
  subscription-fee page. 2026-09-12.
created: '2026-05-04'
modified: '2026-09-12'
# SUPERSEDED 2026-09-12. Every previous version of this file was a bulk-sweep scaffold
# dated 2026-05-04 that invented a Free / Professional / Enterprise ladder with monthly
# request quotas, overage pricing, SLA targets and a dedicated account manager for a
# U.S. government corporation that sells no API product and charges nobody for data
# access. Those plans never existed and have been removed.
tags:
  - Federal Government
  - Housing
  - Mortgages
description: >-
  Ginnie Mae publishes no API plans and charges nothing for API or data access. This
  is an honest zero, and it is the correct answer for this provider rather than a gap.
plan_count: 0
plans: []
pricing_model: free
pricing_url: null
evidence:
  - probe: https://www.ginniemae.gov/sitemap.xml
    status: 200
    finding: >-
      1,786 URLs; no /pricing, /plans, /tiers or fee page. The only account-creation
      flow on the site is https://www.ginniemae.gov/disclosure/create-account (HTTP 200),
      which registers a free login for the Disclosure Data Download application.
  - probe: https://www.ginniemae.gov/system/menu/footer/linkset
    status: 200
    finding: 'Footer navigation carries no pricing or plans entry.'
  - probe: https://www.ginniemae.gov/api/v1/
    status: 200
    finding: >-
      The public JSON:API content surface requires no account, no key and no payment;
      all 120 resource collections answered anonymously.
note: >-
  Ginnie Mae is a wholly-owned U.S. government corporation within HUD. Its disclosure
  data is public information distributed at no charge, and access to it is gated by a
  free registration on the bulk download application rather than by price. There is no
  commercial API programme to describe. Fees do exist elsewhere in the Ginnie Mae
  programme — guaranty fees and commitment-authority fees paid by Issuers — but those
  are securities-programme fees, not API or data pricing, and registering them here
  would misrepresent them.
